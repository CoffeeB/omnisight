[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisight"
version = "0.1.0"
description = "Research platform for robust semantic understanding of terrain and environments from aerial and ground imagery."
authors = [
    { name = "OmniSight Research Group", email = "research@omnisight.org" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pillow>=9.5.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
]
cpp = [
    "pybind11>=2.12.0",
]

[project.scripts]
omnisight = "run_experiment:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "datasets*", "experiments*"]

[tool.pyright]
include = [".", "src", "datasets", "experiments", "tests", "notebooks"]
extraPaths = [".", "./src"]
executionEnvironments = [
    { root = ".", extraPaths = [".", "./src"] }
]

[tool.pytest.ini_options]
pythonpath = ["."]
